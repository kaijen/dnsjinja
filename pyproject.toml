[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "dnsjinja-kaijen"
dynamic = ["version"]
authors = [{name = "Kai Jendrian", email = "kai@jendrian.de"}]
description = "Manage DNS at Hetzner"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "Jinja2>=3.0",
    "hcloud>=2.0",
    "dnspython>=2.3",
    "Click>=8.0",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
test = ["pytest"]
docs = ["mkdocs-material>=9.5", "mike>=2.1"]
# Hetzner-Plugin-Abhängigkeit. hcloud bleibt vorerst auch in [dependencies],
# damit Default-Installationen den Hetzner-Provider weiterhin mitbringen.
providers-hetzner = ["hcloud>=2.0"]

[project.entry-points."dnsjinja.providers"]
hetzner = "dnsjinja.providers.hetzner:HetznerProvider"

[project.urls]
Homepage = "https://github.com/kaijen/dnsjinja"
"Bug Tracker" = "https://github.com/kaijen/dnsjinja/issues"

[project.scripts]
dnsjinja = "dnsjinja:main"
explore_hetzner = "dnsjinja:explore_main"
exit_on_error = "dnsjinja:exit_on_error"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
version_scheme = "post-release"
local_scheme = "node-and-date"

[tool.hatch.build.targets.wheel]
packages = ["src/dnsjinja"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: Integrationstests, die DNSJINJA_AUTH_API_TOKEN und DNSJINJA_TEST_DOMAIN benötigen",
]
